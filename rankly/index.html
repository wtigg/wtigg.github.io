<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rankly: App Store Rank Tracker</title>
<meta name="description" content="Track where your app ranks on the App Store in 175 countries.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --accent:#C6FF3D; --bg:#000; --card:#111113; --ink:#fff; --muted:rgba(255,255,255,.6); --line:rgba(255,255,255,.1); }
body { margin:0; font-family:Poppins,-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink); background:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:34px 34px; line-height:1.65; }
.wrap { max-width:720px; margin:0 auto; padding:56px 24px 80px; }
a { color:var(--accent); }
a.back { text-decoration:none; font-weight:600; }
h1 { font-size:34px; letter-spacing:-.02em; margin:24px 0 4px; }
.updated { color:var(--muted); margin:0 0 28px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
h2 { font-size:20px; margin:30px 0 8px; }
p, li { color:rgba(255,255,255,.85); }
.card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:6px 26px 22px; margin-top:20px; }
.logo { width:72px; height:72px; border-radius:17px; }
.btn { display:inline-block; background:var(--accent); color:#000; padding:12px 22px; border-radius:14px; font-weight:600; text-decoration:none; margin:8px 8px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icon.png" alt="Rankly">
    <h1>Rankly</h1>
    <p class="updated">APP STORE RANK TRACKER</p>
    <div class="card">
      <p>See where your apps rank in the Top Free and Top Paid charts of 175 App Store countries, get alerts when they move, follow their history and share your best ranks.</p>
      <p><a class="btn" href="support.html">Support</a><a class="btn" href="privacy.html">Privacy</a><a class="btn" href="terms.html">Terms</a></p>
    </div>
    <p class="updated" style="margin-top:28px">Rankly is an independent app and is not affiliated with Apple Inc.</p>
  </div>
</body>
</html>
